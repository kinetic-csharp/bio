<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kinetic</title>
    <meta name="description" content="Kinetic's personal bio">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050208;
            --card: rgba(15, 8, 22, 0.78);
            --border: rgba(174, 91, 255, 0.16);
            --text: #fff;
            --muted: #91879b;
            --purple: #9b4dff;
            --purple-light: #c084ff;
            --purple-dark: #5d20a8;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(155, 77, 255, 0.22),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(93, 32, 168, 0.13),
                    transparent 35%
                ),
                #050208;

            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(155, 77, 255, 0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(155, 77, 255, 0.035) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image: linear-gradient(
                to bottom,
                rgba(0,0,0,1),
                rgba(0,0,0,0)
            );

            pointer-events: none;
        }

        .glow {
            position: fixed;

            width: 400px;
            height: 400px;

            top: -180px;
            left: 50%;

            transform: translateX(-50%);

            background: rgba(155, 77, 255, 0.16);

            filter: blur(110px);

            border-radius: 50%;

            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 520px;
            position: relative;
            z-index: 2;
        }

        .card {
            padding: 38px 32px;
            text-align: center;

            background: var(--card);

            border: 1px solid var(--border);
            border-radius: 28px;

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 30px 100px rgba(0,0,0,0.75),
                0 0 80px rgba(155,77,255,0.07),
                inset 0 1px 0 rgba(255,255,255,0.04);

            animation: enter 0.7s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* PROFILE */

        .profile-wrapper {
            position: relative;
            width: 125px;
            height: 125px;
            margin: 0 auto 22px;
        }

        .profile {
            width: 125px;
            height: 125px;

            object-fit: cover;
            border-radius: 50%;

            border: 3px solid rgba(192,132,255,0.9);

            box-shadow:
                0 0 0 8px rgba(155,77,255,0.07),
                0 0 40px rgba(155,77,255,0.25),
                0 20px 50px rgba(0,0,0,0.65);

            display: block;
        }

        .online {
            position: absolute;

            width: 19px;
            height: 19px;

            right: 4px;
            bottom: 7px;

            background: #7dff9a;

            border: 4px solid #100a15;

            border-radius: 50%;

            box-shadow: 0 0 15px rgba(125,255,154,0.5);
        }

        .name {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1.5px;
            line-height: 1;

            text-shadow:
                0 0 25px rgba(155,77,255,0.25);
        }

        .username {
            margin-top: 9px;
            color: var(--muted);
            font-size: 14px;
        }

        .bio {
            max-width: 390px;
            margin: 22px auto 25px;

            color: #bcb3c7;

            font-size: 15px;
            line-height: 1.7;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            padding: 8px 14px;
            margin-bottom: 27px;

            color: #aaa0b4;

            font-size: 12px;

            border-radius: 999px;

            background: rgba(155,77,255,0.055);
            border: 1px solid var(--border);
        }

        .status-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #7dff9a;

            box-shadow: 0 0 10px #7dff9a;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 11px;
        }

        .link {
            min-height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 20px;

            color: #fff;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            background: rgba(155,77,255,0.045);

            border: 1px solid var(--border);
            border-radius: 15px;

            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease,
                box-shadow .2s ease;
        }

        .link:hover {
            transform: translateY(-3px);

            background: rgba(155,77,255,0.11);

            border-color: rgba(192,132,255,0.35);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.3),
                0 0 25px rgba(155,77,255,0.08);
        }

        .icon {
            margin-right: 9px;
            opacity: .7;
            font-size: 15px;
        }

        .footer {
            margin-top: 26px;
            color: #554c5d;
            font-size: 11px;
            letter-spacing: .3px;
        }

        /* MUSIC */

        .music-control {
            position: fixed;

            right: 20px;
            bottom: 20px;

            width: 42px;
            height: 42px;

            border: 1px solid var(--border);
            border-radius: 50%;

            background: rgba(15,8,22,.8);

            color: var(--purple-light);

            display: none;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            backdrop-filter: blur(12px);

            box-shadow:
                0 10px 30px rgba(0,0,0,.4),
                0 0 25px rgba(155,77,255,.1);

            transition: .2s;
        }

        .music-control:hover {
            transform: scale(1.08);
            border-color: var(--purple);
            box-shadow: 0 0 30px rgba(155,77,255,.25);
        }

        /* CLICK SCREEN */

        #enterScreen {
            position: fixed;
            inset: 0;

            z-index: 9999;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(155,77,255,0.15),
                    transparent 45%
                ),
                #050208;

            cursor: pointer;

            transition:
                opacity .6s ease,
                visibility .6s ease;
        }

        #enterScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-content {
            text-align: center;
        }

        .enter-title {
            font-size: 13px;
            font-weight: 700;

            letter-spacing: .25em;
            text-transform: uppercase;

            color: #fff;

            text-shadow:
                0 0 30px rgba(155,77,255,.5);
        }

        .enter-subtitle {
            margin-top: 12px;

            font-size: 11px;
            letter-spacing: .12em;

            color: var(--muted);
        }

        .enter-ring {
            width: 95px;
            height: 95px;

            margin: 0 auto 25px;

            border-radius: 50%;

            border: 1px solid rgba(155,77,255,.4);

            box-shadow:
                0 0 30px rgba(155,77,255,.12),
                inset 0 0 30px rgba(155,77,255,.06);

            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,100% {
                transform: scale(.95);
                opacity: .55;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 18px 12px;
            }

            .card {
                padding: 32px 20px;
                border-radius: 23px;
            }

            .profile,
            .profile-wrapper {
                width: 110px;
                height: 110px;
            }

            .name {
                font-size: 29px;
            }

            .bio {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- CLICK TO ENTER -->
    <div id="enterScreen">
        <div class="enter-content">
            <div class="enter-ring"></div>

            <div class="enter-title">
                Click to view profile
            </div>

            <div class="enter-subtitle">
                headphones recommended
            </div>
        </div>
    </div>

    <div class="glow"></div>

    <main class="container">
        <section class="card">

            <div class="profile-wrapper">
                <img
                    src="images/profile.png"
                    alt="Kinetic"
                    class="profile"
                >

                <div class="online"></div>
            </div>

            <h1 class="name">Kinetic</h1>

            <p class="username">@n9pu</p>

            <p class="bio">
                Developer, creator, and builder.
                Making things on the internet and probably
                breaking a few along the way.
            </p>

            <div class="status">
                <span class="status-dot"></span>
                Currently online
            </div>

            <div class="links">

                <a
                    class="link"
                    href="https://github.com/kinetic-csharp"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon">⌘</span>
                    GitHub
                </a>

                <a
                    class="link"
                    href="https://discord.com/users/792576219785986090"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <span class="icon">◈</span>
                    Discord
                </a>

                <a class="link" href="/drive/">
                    <span class="icon">◫</span>
                    Drive
                </a>

                <a class="link" href="#">
                    <span class="icon">✉</span>
                    Contact
                </a>

            </div>

            <div class="footer">
                © 2026 Kinetic
            </div>

        </section>
    </main>

    <button
        id="musicControl"
        class="music-control"
        title="Toggle music"
        aria-label="Toggle music"
    >
        ♪
    </button>

    <audio id="bgMusic" loop preload="auto">
        <source src="music/bg-music.mp3" type="audio/mpeg">
    </audio>

    <script>
        const enterScreen = document.getElementById("enterScreen");
        const musicControl = document.getElementById("musicControl");
        const audio = document.getElementById("bgMusic");

        let playing = false;

        async function startMusic() {
            try {
                await audio.play();

                playing = true;
                musicControl.style.display = "flex";
                musicControl.textContent = "♫";
            } catch (err) {
                console.log("Music could not start:", err);
            }
        }

        enterScreen.addEventListener("click", async () => {
            await startMusic();

            enterScreen.classList.add("hidden");
        });

        musicControl.addEventListener("click", async () => {
            if (audio.paused) {
                await audio.play();
                playing = true;
                musicControl.textContent = "♫";
            } else {
                audio.pause();
                playing = false;
                musicControl.textContent = "♪";
            }
        });
    </script>

</body>
</html>
