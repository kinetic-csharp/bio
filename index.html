        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        :root {
            --bg: #050008;
            --card: rgba(13, 5, 18, 0.82);

        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px 15px;

            font-family:

                -apple-system,

                ),

                    transparent 35%

                #050008;

            overflow-x: hidden;
        }

        body::before {
            content: "";

            position: fixed;

            background-image:
                linear-gradient(
                    rgba(168, 85, 247, 0.035) 1px,
                    transparent 1px
                ),

                    90deg,
                    rgba(168, 85, 247, 0.035) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image: linear-gradient(
                to bottom,
                rgba(0,0,0,1),
                rgba(0,0,0,0)
            );

            pointer-events: none;
        }

        .glow {
            position: fixed;

            width: 420px;
            height: 420px;

            top: -180px;
            left: 50%;

            transform: translateX(-50%);

            background: rgba(168, 85, 247, 0.13);

            filter: blur(110px);

            border-radius: 50%;

            pointer-events: none;
        }

        .glow-bottom {
            position: fixed;

            width: 300px;
            height: 300px;

            bottom: -180px;
            right: -100px;

            background: rgba(126, 34, 206, 0.10);

            filter: blur(100px);

            border-radius: 50%;

            pointer-events: none;
        }

        /* =========================
           PROFILE CONTENT
        ========================= */

        .container {
            width: 100%;
            max-width: 520px;

            position: relative;
            z-index: 2;

            transition:
                filter 0.8s ease,
                transform 0.8s ease;
        }

        .container.locked {
            filter: blur(18px);
            transform: scale(1.025);
        }

        .card {
            padding: 38px 32px;

            text-align: center;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 28px;

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.75),
                0 0 60px rgba(168, 85, 247, 0.06),
                inset 0 1px 0 rgba(255,255,255,0.035);

            animation: enter 0.7s cubic-bezier(.2,.8,.2,1);
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* =========================
           PROFILE
        ========================= */

        .profile-wrapper {
            position: relative;

            width: 125px;
            height: 125px;

            margin: 0 auto 22px;
        }

        .profile {
            width: 125px;
            height: 125px;

            object-fit: cover;

            border-radius: 50%;

            border: 3px solid var(--purple-light);

            box-shadow:
                0 0 0 8px rgba(168, 85, 247, 0.06),
                0 0 35px rgba(168, 85, 247, 0.28),
                0 20px 50px rgba(0,0,0,0.7);

        }

        .name {

           LINKS

        .links {

            justify-content: center;

            color: #fff;

            text-decoration: none;

            font-size: 14px;

            font-weight: 600;

            background:
                linear-gradient(

                transform .2s ease,

        }

        .icon {
            margin-right: 9px;

            color: var(--purple-light);

            opacity: .85;

            font-size: 15px;
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            margin-top: 26px;

            color: #5f5265;

            font-size: 11px;

            letter-spacing: .3px;

           MUSIC BUTTON

        .music-control {
            position: fixed;

            right: 22px;
            bottom: 22px;

            display: flex;

            justify-content: center;

            color: white;

            background: rgba(13, 5, 18, 0.9);

            border: 1px solid rgba(168, 85, 247, 0.3);

            border-radius: 50%;

            cursor: pointer;

            font-size: 17px;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .5s ease,

            z-index: 10;
        }

        body.entered .music-control {
            opacity: 1;
            pointer-events: auto;
        }

        .music-control:hover {
            transform: scale(1.08);

            border-color: rgba(168, 85, 247, 0.65);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.4),

        }

        /* =========================
           CLICK TO ENTER OVERLAY
        ========================= */

        .enter-screen {
            position: fixed;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            background:
                radial-gradient(
                    circle at center,
                    rgba(30, 8, 45, 0.55),
                    rgba(3, 0, 6, 0.92)

            backdrop-filter: blur(10px);

            z-index: 100;

            transition:

        .enter-screen.hidden {
            opacity: 0;

        .enter-text {
            color: white;

            font-weight: 600;

            text-shadow:

        }

        .enter-subtext {
            margin-top: 10px;

            color: #8e789a;

            font-size: 12px;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: .55;
            }

            50% {
                opacity: 1;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 520px) {
            body {
                padding: 18px 12px;
            }

            .card {

                border-radius: 23px;

            .profile,

            }

            }

            .music-control {
                right: 15px;
                bottom: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="glow"></div>

                <a

                >

                    <span class="icon">↗</span>

                </a>

    <script>
        const enterScreen = document.getElementById("enterScreen");
        const profile = document.getElementById("profile");
        const music = document.getElementById("bgMusic");
        const musicButton = document.getElementById("musicButton");

        let entered = false;

        function enterProfile() {
            if (entered) return;

            entered = true;

            /*
             * Start music from the user's interaction.
             * This avoids the browser autoplay restriction.
             */
            music.volume = 0.5;

            music.play()
                .then(() => {
                    musicButton.textContent = "♫";
                })
                .catch(() => {
                    musicButton.textContent = "♪";
                });

            /*
             * Remove blur.
             */
            profile.classList.remove("locked");

            /*
             * Show profile.
             */
            document.body.classList.add("entered");

            /*
             * Remove overlay.
             */
            enterScreen.classList.add("hidden");
        }

        enterScreen.addEventListener("click", enterProfile);

        enterScreen.addEventListener("touchstart", enterProfile, {
            passive: true
        });

        musicButton.addEventListener("click", (event) => {
            event.stopPropagation();

            if (music.paused) {
                music.play()
                    .then(() => {
                        musicButton.textContent = "♫";
                    })
                    .catch(() => {});
            } else {
                music.pause();

                musicButton.textContent = "♪";
            }
        });
    </script>
