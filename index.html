<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lerpy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

:root {
  --white: #f0ece4;
  --black: #080808;
  --gray: #888;
  --accent: #e8e0d0;
}

html, body {
  width: 100%; height: 100%;
  background: var(--black);
  color: var(--white);
  font-family: 'Space Mono', monospace;
  overflow-x: hidden;
}

/* ── HALFTONE BACKGROUND ── */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,.07) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
  z-index: 0;
}

/* ── VIGNETTE ── */
body::after {
  content: "";
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.85) 100%);
  pointer-events: none;
  z-index: 0;
}

/* ── MANGA BANNER ── */
.banner {
  position: relative;
  width: 100%;
  height: 340px;
  overflow: hidden;
  background: var(--black);
}

/* SVG manga eyes rendered inline */
.banner svg {
  width: 100%;
  height: 100%;
  display: block;
  filter: contrast(1.6) brightness(0.9);
}

.banner img {
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  filter: contrast(1.15) brightness(0.85);
}

/* scan-line overlay */
.banner::after {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,.18) 3px,
    rgba(0,0,0,.18) 4px
  );
  pointer-events: none;
}

/* glitch edge */
.banner::before {
  content: "";
  position: absolute; bottom: 0; left: 0; right: 0;
  height: 80px;
  background: linear-gradient(to top, var(--black), transparent);
  z-index: 2;
  pointer-events: none;
}

/* ── LAYOUT ── */
.page {
  position: relative;
  z-index: 1;
  max-width: 720px;
  margin: 0 auto;
}

/* ── PROFILE ROW ── */
.profile-row {
  display: flex;
  align-items: flex-end;
  gap: 20px;
  padding: 0 24px;
  margin-top: -54px;
  position: relative;
  z-index: 5;
}

.avatar-wrap {
  position: relative;
  flex-shrink: 0;
}

.avatar {
  width: 108px;
  height: 108px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--black);
  display: block;
  background: #1a1a1a;
  /* fallback placeholder */
}

/* glitch ring */
.avatar-wrap::before {
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.3);
  animation: spin 8s linear infinite;
}

.avatar-wrap::after {
  content: "";
  position: absolute;
  inset: -9px;
  border-radius: 50%;
  border: 1px dashed rgba(255,255,255,.1);
  animation: spin 14s linear infinite reverse;
}

.name-block {
  padding-bottom: 10px;
}

h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(3rem, 10vw, 5.5rem);
  letter-spacing: 3px;
  line-height: 1;
  color: var(--white);
  text-shadow: 3px 3px 0 rgba(255,255,255,.08);
  position: relative;
  display: inline-block;
}

/* glitch text effect */
h1::before {
  content: attr(data-text);
  position: absolute;
  top: 0; left: 2px;
  color: rgba(255, 80, 80, 0.4);
  clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
  animation: glitch-1 4s infinite;
}

h1::after {
  content: attr(data-text);
  position: absolute;
  top: 0; left: -2px;
  color: rgba(80, 200, 255, 0.3);
  clip-path: polygon(0 65%, 100% 65%, 100% 80%, 0 80%);
  animation: glitch-2 4s infinite;
}

/* ── INFO SECTION ── */
.info {
  padding: 20px 24px 0;
}

.tagline {
  font-family: 'Space Mono', monospace;
  font-size: .75rem;
  color: var(--gray);
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 14px;
}

.tagline span {
  color: var(--white);
}

/* ── STATUS PILL ── */
.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 5px 12px 5px 10px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 2px;
  font-size: .7rem;
  color: #aaa;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 28px;
  background: rgba(255,255,255,.02);
}

.dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: pulse 2s ease-in-out infinite;
}

/* ── DIVIDER ── */
.divider {
  width: 100%;
  height: 1px;
  background: linear-gradient(to right, rgba(255,255,255,.2), transparent);
  margin-bottom: 22px;
}

/* ── LINKS ── */
.links {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 24px;
}

.link-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,.06);
  text-decoration: none;
  color: var(--white);
  transition: all .2s;
  position: relative;
  overflow: hidden;
  group: true;
}

.link-item::before {
  content: "";
  position: absolute;
  left: -100%; top: 0; bottom: 0;
  width: 100%;
  background: rgba(255,255,255,.04);
  transition: left .25s ease;
}

.link-item:hover::before { left: 0; }

.link-item:hover { padding-left: 8px; }

.link-left {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: .82rem;
  letter-spacing: 1px;
}

.link-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  color: rgba(255,255,255,.2);
  width: 24px;
}

.link-name {
  font-weight: 700;
  font-size: .78rem;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.link-sub {
  font-size: .62rem;
  color: var(--gray);
  letter-spacing: 1px;
  margin-top: 2px;
}

.link-arrow {
  font-size: .7rem;
  color: rgba(255,255,255,.25);
  transition: transform .2s, color .2s;
}

.link-item:hover .link-arrow {
  transform: translateX(4px);
  color: var(--white);
}

/* ── FOOTER ── */
.footer {
  padding: 32px 24px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-tag {
  font-size: .6rem;
  color: rgba(255,255,255,.15);
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* ── MUSIC PLAYER ── */
.player {
  position: fixed;
  bottom: 22px; right: 22px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: rgba(8,8,8,.92);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(18px);
  border-radius: 2px;
  z-index: 99;
  animation: fadeUp .6s .5s cubic-bezier(.22,1,.36,1) both;
}

.play-btn {
  width: 34px; height: 34px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,.2);
  background: transparent;
  color: var(--white);
  cursor: pointer;
  font-size: .85rem;
  transition: .2s;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.play-btn:hover { background: rgba(255,255,255,.1); }

.player-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}

.track-name {
  font-family: 'Space Mono', monospace;
  font-size: .6rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--white);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 140px;
}

.progress-wrap {
  width: 140px;
  height: 2px;
  background: rgba(255,255,255,.12);
  cursor: pointer;
  position: relative;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: var(--white);
  transition: width .1s linear;
  pointer-events: none;
}

.vol-btn {
  width: 28px; height: 28px;
  border: none;
  background: transparent;
  color: rgba(255,255,255,.35);
  cursor: pointer;
  font-size: .8rem;
  transition: .2s;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.vol-btn:hover { color: var(--white); }

audio { display: none; }

/* ── ANIMATIONS ── */
@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  0%,100% { opacity:1; }
  50% { opacity:.2; }
}

@keyframes glitch-1 {
  0%,90%,100% { clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%); transform: translateX(0); }
  92% { clip-path: polygon(0 5%, 100% 5%, 100% 20%, 0 20%); transform: translateX(-3px); }
  94% { clip-path: polygon(0 60%, 100% 60%, 100% 75%, 0 75%); transform: translateX(3px); }
  96% { clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%); transform: translateX(0); }
}

@keyframes glitch-2 {
  0%,88%,100% { clip-path: polygon(0 65%, 100% 65%, 100% 80%, 0 80%); transform: translateX(0); }
  90% { clip-path: polygon(0 10%, 100% 10%, 100% 30%, 0 30%); transform: translateX(3px); }
  93% { clip-path: polygon(0 50%, 100% 50%, 100% 65%, 0 65%); transform: translateX(-2px); }
  95% { clip-path: polygon(0 65%, 100% 65%, 100% 80%, 0 80%); transform: translateX(0); }
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to { opacity:1; transform:translateY(0); }
}

.page > * {
  animation: fadeUp .7s cubic-bezier(.22,1,.36,1) both;
}
.banner { animation-delay: 0s; }
.profile-row { animation-delay: .1s; }
.info { animation-delay: .2s; }
.links { animation-delay: .3s; }
.footer { animation-delay: .4s; }

/* mobile */
@media(max-width: 480px) {
  .banner { height: 220px; }
  .avatar { width: 86px; height: 86px; }
  .footer-tag:last-child { display: none; }
}
</style>
</head>
<body>

<div class="page">

  <!-- BANNER: replace banner.png with your own image -->
  <div class="banner">
    <img src="images/banner.jpg" alt="banner">
  </div>

  <!-- PROFILE ROW -->
  <div class="profile-row">
    <div class="avatar-wrap">
      <img src="images/profile.png" class="avatar" alt="lerpy"
           onerror="this.style.background='#1c1c1c'; this.style.display='flex'">
    </div>
    <div class="name-block">
      <h1 data-text="lerpy">lerpy</h1>
    </div>
  </div>

  <!-- INFO -->
  <div class="info">
    <div class="tagline">
      <span>producer</span> • <span>designer</span> • <span>creator</span>
    </div>
    <div class="status">
      <div class="dot"></div>
      online
    </div>
    <div class="divider"></div>
  </div>

  <!-- LINKS -->
  <div class="links">
    <a href="https://twitter.com/batmantinoo" target="_blank" class="link-item">
      <div class="link-left">
        <span class="link-num">01</span>
        <div>
          <div class="link-name">Twitter</div>
          <div class="link-sub">@batmantinoo</div>
        </div>
      </div>
      <span class="link-arrow">→</span>
    </a>

    <a href="https://github.com/lerpyypluh" target="_blank" class="link-item">
      <div class="link-left">
        <span class="link-num">02</span>
        <div>
          <div class="link-name">GitHub</div>
          <div class="link-sub">lerpyypluh</div>
        </div>
      </div>
      <span class="link-arrow">→</span>
    </a>

    <a href="https://discord.com" target="_blank" class="link-item">
      <div class="link-left">
        <span class="link-num">03</span>
        <div>
          <div class="link-name">Discord</div>
          <div class="link-sub">join the server</div>
        </div>
      </div>
      <span class="link-arrow">→</span>
    </a>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="footer-tag">lerpy © 2026</span>
    <span class="footer-tag">producer • designer • creator</span>
  </div>

</div>

<!-- MUSIC PLAYER -->
<div class="player">
  <button class="play-btn" id="playBtn">▶</button>
  <div class="player-info">
    <div class="track-name" id="trackName">bg-music</div>
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>
  <button class="vol-btn" id="volBtn">♪</button>
</div>

<audio id="music" loop>
  <source src="music/bg-music.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("music");
const playBtn = document.getElementById("playBtn");
const progressBar = document.getElementById("progressBar");
const progressWrap = document.getElementById("progressWrap");
const volBtn = document.getElementById("volBtn");

playBtn.addEventListener("click", () => {
  if (music.paused) {
    music.play().catch(() => {});
    playBtn.textContent = "❚❚";
  } else {
    music.pause();
    playBtn.textContent = "▶";
  }
});

music.addEventListener("timeupdate", () => {
  if (!music.duration) return;
  progressBar.style.width = (music.currentTime / music.duration * 100) + "%";
});

progressWrap.addEventListener("click", (e) => {
  if (!music.duration) return;
  const rect = progressWrap.getBoundingClientRect();
  music.currentTime = ((e.clientX - rect.left) / rect.width) * music.duration;
});

let muted = false;
volBtn.addEventListener("click", () => {
  muted = !muted;
  music.muted = muted;
  volBtn.style.color = muted ? "rgba(255,255,255,.15)" : "";
});
</script>
</body>
</html>
