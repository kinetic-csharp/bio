<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tino</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
}

.container{
    width:100%;
    max-width:600px;
    padding:40px;
    animation:fadeUp 1s ease;
}

.profile{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #fff;
    margin-bottom:25px;
    animation:float 4s ease-in-out infinite;
}

h1{
    font-size:4rem;
    font-weight:700;
    letter-spacing:-2px;
    margin-bottom:10px;
}

.tagline{
    color:#888;
    margin-bottom:30px;
    font-size:1rem;
}

.links{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:30px;
}

.links a{
    color:white;
    text-decoration:none;
    border:1px solid #333;
    padding:12px 20px;
    border-radius:12px;
    transition:.25s;
}

.links a:hover{
    background:white;
    color:black;
    transform:translateY(-3px);
}

.music-btn{
    background:none;
    border:1px solid #333;
    color:white;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
    transition:.25s;
}

.music-btn:hover{
    background:white;
    color:black;
}

audio{
    display:none;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes float{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-8px);
    }
}
</style>
</head>
<body>

<div class="container">

    <img src="images/profile.png" class="profile" alt="Profile">

    <h1>TINO</h1>

    <div class="tagline">
        Producer • Designer • Creator
    </div>

    <div class="links">
        <a href="https://twitter.com/batmantinoo" target="_blank">Twitter</a>
        <a href="https://github.com/tinosgames" target="_blank">GitHub</a>
    </div>

    <button class="music-btn" id="musicBtn">
        Play Music
    </button>

    <audio id="music" loop>
        <source src="music/bg-music.mp3" type="audio/mpeg">
    </audio>

</div>

<script>
const music = document.getElementById('music');
const btn = document.getElementById('musicBtn');

btn.onclick = () => {
    if(music.paused){
        music.play();
        btn.textContent = 'Pause Music';
    } else {
        music.pause();
        btn.textContent = 'Play Music';
    }
};
</script>

</body>
</html>
