<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Kinetic | Drive</title>

    <meta
        name="description"
        content="Kinetic's personal file drive"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="icon"
        href="../profile.png"
        type="image/png"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #050208;
            --surface: rgba(15,8,22,.78);
            --surface2: rgba(25,12,38,.8);

            --border: rgba(155,77,255,.15);

            --text: #fff;
            --muted: #91879b;

            --purple: #9b4dff;
            --purple-light: #c084ff;
            --purple-dark: #5d20a8;

            --green: #7dff9a;

            --mono: "DM Mono", monospace;
            --sans: Inter, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(155,77,255,.18),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 0% 100%,
                    rgba(93,32,168,.10),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family: var(--mono);

            overflow-x: hidden;

            cursor: none;
        }

        /* GRID */

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(155,77,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(155,77,255,.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent
                );

            pointer-events: none;

            z-index: 0;
        }

        /* CURSOR */

        .cursor {
            position: fixed;

            width: 9px;
            height: 9px;

            background: var(--purple-light);

            border-radius: 50%;

            pointer-events: none;

            z-index: 9999;

            transform: translate(-50%,-50%);

            box-shadow:
                0 0 15px rgba(155,77,255,.8);

            transition: transform .12s;
        }

        .cursor-ring {
            position: fixed;

            width: 34px;
            height: 34px;

            border:
                1px solid
                rgba(155,77,255,.55);

            border-radius: 50%;

            pointer-events: none;

            z-index: 9998;

            transform: translate(-50%,-50%);

            transition:
                transform .18s ease-out,
                opacity .25s;

            opacity: .5;
        }

        /* HEADER */

        header {
            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            z-index: 100;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 20px 28px;
        }

        .header-logo {
            color: var(--muted);

            font-size: .7rem;

            letter-spacing: .2em;

            text-transform: uppercase;

            text-decoration: none;

            transition: color .2s;
        }

        .header-logo:hover {
            color: var(--purple-light);
        }

        .header-right {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid
                var(--border);

            border-radius: 10px;

            background:
                rgba(15,8,22,.78);

            backdrop-filter: blur(12px);

            color: var(--muted);

            text-decoration: none;

            cursor: none;

            transition: .2s;
        }

        .icon-btn:hover {
            color: var(--purple-light);

            border-color:
                rgba(155,77,255,.45);

            background:
                rgba(155,77,255,.08);

            box-shadow:
                0 0 20px
                rgba(155,77,255,.1);
        }

        /* PAGE */

        .page {
            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 900px;

            margin: auto;

            padding:
                125px 24px 70px;
        }

        .page-eyebrow {
            display: flex;
            align-items: center;
            gap: 12px;

            margin-bottom: 12px;

            color: var(--purple-light);

            font-size: .65rem;

            letter-spacing: .3em;

            text-transform: uppercase;
        }

        .page-eyebrow::after {
            content: "";

            flex: 1;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    var(--border),
                    transparent
                );
        }

        .page-title {
            font-family: var(--sans);

            font-size:
                clamp(
                    4rem,
                    12vw,
                    7.5rem
                );

            font-weight: 800;

            letter-spacing: -.07em;

            line-height: .9;

            margin-bottom: 15px;

            text-shadow:
                0 0 50px
                rgba(155,77,255,.18);
        }

        .page-subtitle {
            color: var(--muted);

            font-size: .65rem;

            letter-spacing: .15em;

            text-transform: uppercase;

            margin-bottom: 42px;
        }

        /* BREADCRUMB */

        .breadcrumb {
            display: flex;
            align-items: center;

            gap: 8px;

            margin-bottom: 14px;

            color: var(--muted);

            font-size: .65rem;

            letter-spacing: .1em;

            text-transform: uppercase;
        }

        .breadcrumb-item {
            transition: color .2s;
        }

        .breadcrumb-item:hover {
            color: var(--purple-light);
        }

        .breadcrumb-item.active {
            color: var(--text);
        }

        .breadcrumb-sep {
            color: var(--border);
        }

        /* STATS */

        .stats-bar {
            display: flex;
            gap: 24px;

            padding: 15px 18px;

            margin-bottom: 10px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            background:
                rgba(15,8,22,.65);

            backdrop-filter: blur(15px);

            color: var(--muted);

            font-size: .6rem;

            letter-spacing: .12em;

            text-transform: uppercase;
        }

        .stats-bar span {
            display: flex;
            align-items: center;

            gap: 6px;
        }

        .stats-bar strong {
            color: var(--purple-light);
        }

        /* FILE LIST */

        #file-list {
            display: flex;

            flex-direction: column;

            gap: 5px;
        }

        .item {
            position: relative;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 14px 16px;

            min-height: 56px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            background:
                rgba(15,8,22,.65);

            backdrop-filter: blur(10px);

            overflow: hidden;

            transition:
                transform .2s,
                background .2s,
                border-color .2s,
                box-shadow .2s;
        }

        .item::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 2px;

            background:
                linear-gradient(
                    var(--purple),
                    var(--purple-light)
                );

            transform:
                scaleY(0);

            transition:
                transform .2s;
        }

        .item:hover {
            transform: translateX(4px);

            background:
                rgba(25,12,38,.82);

            border-color:
                rgba(155,77,255,.28);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.2),
                0 0 25px
                rgba(155,77,255,.05);
        }

        .item:hover::before {
            transform: scaleY(1);
        }

        .item-icon {
            width: 24px;

            flex-shrink: 0;

            text-align: center;

            color: var(--purple-light);
        }

        .item-name {
            flex: 1;

            min-width: 0;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

            color: var(--text);

            font-size: .78rem;
        }

        .folder-item .item-name {
            color: var(--purple-light);
        }

        .item-meta {
            flex-shrink: 0;

            color: var(--muted);

            font-size: .58rem;

            white-space: nowrap;
        }

        .item-actions {
            display: flex;

            align-items: center;

            gap: 5px;

            flex-shrink: 0;
        }

        .action-btn {
            width: 29px;
            height: 29px;

            display: flex;
            align-items: center;
            justify-content: center;

            border:
                1px solid
                var(--border);

            border-radius: 8px;

            background: transparent;

            color: var(--muted);

            text-decoration: none;

            cursor: none;

            transition: .2s;
        }

        .action-btn:hover {
            color: var(--purple-light);

            border-color:
                rgba(155,77,255,.45);

            background:
                rgba(155,77,255,.08);
        }

        .action-btn.copied {
            color: var(--green);

            border-color:
                rgba(125,255,154,.4);
        }

        /* FOLDERS */

        .subfolder {
            margin-left: 30px;

            display: flex;

            flex-direction: column;

            gap: 4px;

            margin-top: 4px;

            max-height: 0;

            overflow: hidden;

            opacity: 0;

            transition:
                max-height .35s ease,
                opacity .25s ease;
        }

        .subfolder.open {
            max-height: 10000px;

            opacity: 1;
        }

        .chevron {
            color: var(--muted);

            font-size: .7rem;

            transition: transform .2s;
        }

        .chevron.open {
            transform: rotate(90deg);

            color: var(--purple-light);
        }

        /* VIDEO */

        .video-wrapper {
            display: none;

            margin-top: 6px;

            border:
                1px solid
                var(--border);

            border-radius: 12px;

            overflow: hidden;
        }

        .video-wrapper.open {
            display: block;
        }

        .video-wrapper video {
            display: block;

            width: 100%;

            background: #000;
        }

        /* LOADING */

        .loading {
            display: flex;

            align-items: center;

            gap: 8px;

            padding: 22px;

            color: var(--muted);

            font-size: .65rem;

            letter-spacing: .15em;

            text-transform: uppercase;
        }

        .loading-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: var(--purple);

            animation:
                loadPulse 1.2s ease-in-out infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: .2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes loadPulse {
            0%,100% {
                opacity: .2;
                transform: scale(.8);
            }

            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ERROR */

        .error-msg {
            padding: 20px;

            border:
                1px solid
                rgba(255,70,70,.25);

            border-radius: 12px;

            background:
                rgba(255,70,70,.05);

            color: #ff7070;

            font-size: .7rem;

            line-height: 1.6;
        }

        .error-msg strong {
            display: block;

            margin-bottom: 6px;

            color: #ff9090;
        }

        .empty-msg {
            padding: 25px;

            color: var(--muted);

            text-align: center;

            font-size: .65rem;

            letter-spacing: .1em;
        }

        /* FOOTER */

        footer {
            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 900px;

            margin: auto;

            padding:
                30px 24px;

            display: flex;

            justify-content: space-between;

            border-top:
                1px solid
                var(--border);

            color: var(--muted);

            font-size: .58rem;

            letter-spacing: .12em;

            text-transform: uppercase;
        }

        .footer-link {
            color: var(--purple-light);

            text-decoration: none;
        }

        /* ENTER SCREEN */

        #enterScreen {
            position: fixed;

            inset: 0;

            z-index: 99999;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                radial-gradient(
                    circle,
                    rgba(155,77,255,.15),
                    transparent 45%
                ),
                #050208;

            cursor: pointer;

            transition:
                opacity .6s,
                visibility .6s;
        }

        #enterScreen.hidden {
            opacity: 0;

            visibility: hidden;

            pointer-events: none;
        }

        .enter-content {
            text-align: center;
        }

        .enter-ring {
            width: 90px;
            height: 90px;

            margin: 0 auto 25px;

            border:
                1px solid
                rgba(155,77,255,.4);

            border-radius: 50%;

            box-shadow:
                0 0 40px
                rgba(155,77,255,.15),

                inset 0 0 30px
                rgba(155,77,255,.08);

            animation:
                pulse 2s ease-in-out infinite;
        }

        .enter-title {
            color: #fff;

            font-family: var(--sans);

            font-size: 13px;

            font-weight: 700;

            letter-spacing: .25em;

            text-transform: uppercase;

            text-shadow:
                0 0 30px
                rgba(155,77,255,.5);
        }

        .enter-subtitle {
            margin-top: 12px;

            color: var(--muted);

            font-size: 10px;

            letter-spacing: .12em;
        }

        @keyframes pulse {
            0%,100% {
                transform: scale(.95);
                opacity: .55;
            }

            50% {
                transform: scale(1.05);
                opacity: 1;
            }
        }

        @media(max-width:500px) {
            .page {
                padding-left: 14px;
                padding-right: 14px;
            }

            .item-meta {
                display: none;
            }

            .page-title {
                font-size: 4rem;
            }

            footer {
                padding-left: 14px;
                padding-right: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- CLICK TO ENTER -->

    <div id="enterScreen">
        <div class="enter-content">
            <div class="enter-ring"></div>

            <div class="enter-title">
                Click to view drive
            </div>

            <div class="enter-subtitle">
                headphones recommended
            </div>
        </div>
    </div>

    <!-- CURSOR -->

    <div class="cursor" id="cursor"></div>
    <div class="cursor-ring" id="cursorRing"></div>

    <!-- HEADER -->

    <header>

        <a
            class="header-logo"
            href="../"
        >
            ← Kinetic
        </a>

        <div class="header-right">

            <button
                id="playPause"
                class="icon-btn"
                aria-label="Toggle music"
                title="Music"
            >
                ♪
            </button>

            <a
                class="icon-btn"
                href="../"
                title="Home"
            >
                ⌂
            </a>

        </div>

    </header>

    <!-- PAGE -->

    <main class="page">

        <div class="page-eyebrow">
            002 / Files
        </div>

        <h1 class="page-title">
            DRIVE
        </h1>

        <p class="page-subtitle">
            github.com/kinetic-csharp/bio · /drive
        </p>

        <div class="breadcrumb">
            <span class="breadcrumb-item active">
                root
            </span>
        </div>

        <div class="stats-bar">

            <span>
                <strong id="stat-files">—</strong>
                files
            </span>

            <span>
                <strong id="stat-folders">—</strong>
                folders
            </span>

            <span>
                GitHub API
            </span>

        </div>

        <div id="file-list">

            <div class="loading">

                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>

                <span>
                    Fetching files
                </span>

            </div>

        </div>

    </main>

    <footer>

        <span>
            kinetic / drive
        </span>

        <span>
            Built by
            <a
                class="footer-link"
                href="https://github.com/kinetic-csharp"
                target="_blank"
            >
                Kinetic
            </a>
        </span>

    </footer>

    <audio
        id="bgMusic"
        loop
        preload="auto"
    >
        <source
            src="../music/bg-music.mp3"
            type="audio/mpeg"
        >
    </audio>

    <script>
        /* =========================
           ENTER + MUSIC
        ========================= */

        const enterScreen =
            document.getElementById("enterScreen");

        const audio =
            document.getElementById("bgMusic");

        const playBtn =
            document.getElementById("playPause");

        let playing = false;

        async function startMusic() {

            try {

                await audio.play();

                playing = true;

                playBtn.textContent = "♫";

            } catch (error) {

                console.log(
                    "Music could not start:",
                    error
                );

            }

        }

        enterScreen.addEventListener(
            "click",
            async () => {

                await startMusic();

                enterScreen.classList.add(
                    "hidden"
                );

            }
        );

        playBtn.addEventListener(
            "click",
            async () => {

                if (audio.paused) {

                    await audio.play();

                    playing = true;

                    playBtn.textContent = "♫";

                } else {

                    audio.pause();

                    playing = false;

                    playBtn.textContent = "♪";

                }

            }
        );


        /* =========================
           CURSOR
        ========================= */

        const cursor =
            document.getElementById("cursor");

        const cursorRing =
            document.getElementById("cursorRing");

        let mx = 0;
        let my = 0;

        let rx = 0;
        let ry = 0;

        document.addEventListener(
            "mousemove",
            e => {

                mx = e.clientX;
                my = e.clientY;

                cursor.style.left =
                    mx + "px";

                cursor.style.top =
                    my + "px";

            }
        );

        function animateCursor() {

            rx += (mx - rx) * .12;
            ry += (my - ry) * .12;

            cursorRing.style.left =
                rx + "px";

            cursorRing.style.top =
                ry + "px";

            requestAnimationFrame(
                animateCursor
            );

        }

        animateCursor();


        /* =========================
           GITHUB DRIVE
        ========================= */

        const OWNER =
            "kinetic-csharp";

        const REPO =
            "bio";

        const VIDEO_EXTS =
            new Set([
                "mp4",
                "webm",
                "mov",
                "ogg",
                "mkv"
            ]);

        const IMAGE_EXTS =
            new Set([
                "png",
                "jpg",
                "jpeg",
                "gif",
                "webp",
                "svg"
            ]);

        const AUDIO_EXTS =
            new Set([
                "mp3",
                "wav",
                "ogg",
                "flac",
                "aac",
                "m4a"
            ]);

        let totalFiles = 0;
        let totalFolders = 0;


        function getIcon(item) {

            if (item.type === "dir")
                return "▶";

            const ext =
                item.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            if (VIDEO_EXTS.has(ext))
                return "▶";

            if (IMAGE_EXTS.has(ext))
                return "◈";

            if (AUDIO_EXTS.has(ext))
                return "♪";

            if (ext === "pdf")
                return "▤";

            if (
                [
                    "zip",
                    "rar",
                    "7z",
                    "tar",
                    "gz"
                ].includes(ext)
            )
                return "⊞";

            if (
                [
                    "js",
                    "ts",
                    "py",
                    "html",
                    "css",
                    "json",
                    "md"
                ].includes(ext)
            )
                return "⌨";

            return "◻";

        }


        function formatSize(bytes) {

            if (!bytes)
                return "";

            if (bytes < 1024)
                return bytes + " B";

            if (bytes < 1024 * 1024)
                return (
                    bytes / 1024
                ).toFixed(1) + " KB";

            return (
                bytes / (1024 * 1024)
            ).toFixed(1) + " MB";

        }


        async function fetchContents(
            path,
            container,
            depth = 0
        ) {

            const loadEl =
                document.createElement(
                    "div"
                );

            loadEl.className =
                "loading";

            loadEl.innerHTML = `
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <span>Loading...</span>
            `;

            container.appendChild(loadEl);

            try {

                const res =
                    await fetch(
                        `https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,
                        {
                            headers: {
                                "Accept":
                                    "application/vnd.github.v3+json"
                            }
                        }
                    );

                if (!res.ok) {

                    throw new Error(
                        res.status === 403
                            ? "GitHub API rate limit hit. Try again later."
                            : `HTTP ${res.status} — ${res.statusText}`
                    );

                }

                const items =
                    await res.json();

                loadEl.remove();

                if (!items.length) {

                    const empty =
                        document.createElement(
                            "div"
                        );

                    empty.className =
                        "empty-msg";

                    empty.textContent =
                        "This folder is empty";

                    container.appendChild(
                        empty
                    );

                    return;

                }

                items.sort(
                    (a, b) => {

                        if (
                            a.type !==
                            b.type
                        ) {

                            return a.type ===
                                "dir"
                                ? -1
                                : 1;

                        }

                        return a.name.localeCompare(
                            b.name
                        );

                    }
                );


                for (
                    const item of items
                ) {

                    if (depth === 0) {

                        item.type === "dir"
                            ? totalFolders++
                            : totalFiles++;

                        document
                            .getElementById(
                                "stat-files"
                            )
                            .textContent =
                            totalFiles;

                        document
                            .getElementById(
                                "stat-folders"
                            )
                            .textContent =
                            totalFolders;

                    }


                    const wrapper =
                        document.createElement(
                            "div"
                        );


                    const el =
                        document.createElement(
                            "div"
                        );

                    el.className =
                        "item " +
                        (
                            item.type === "dir"
                                ? "folder-item"
                                : "file-item"
                        );


                    const icon =
                        document.createElement(
                            "span"
                        );

                    icon.className =
                        "item-icon";

                    icon.textContent =
                        getIcon(item);


                    const name =
                        document.createElement(
                            "span"
                        );

                    name.className =
                        "item-name";

                    name.textContent =
                        item.name;


                    const meta =
                        document.createElement(
                            "span"
                        );

                    meta.className =
                        "item-meta";

                    meta.textContent =
                        item.size
                            ? formatSize(
                                item.size
                            )
                            : "";


                    const actions =
                        document.createElement(
                            "div"
                        );

                    actions.className =
                        "item-actions";


                    el.appendChild(icon);
                    el.appendChild(name);
                    el.appendChild(meta);
                    el.appendChild(actions);

                    wrapper.appendChild(el);


                    /* FOLDER */

                    if (
                        item.type === "dir"
                    ) {

                        const chev =
                            document.createElement(
                                "span"
                            );

                        chev.className =
                            "chevron";

                        chev.textContent =
                            "▶";

                        el.insertBefore(
                            chev,
                            icon
                        );


                        const subContainer =
                            document.createElement(
                                "div"
                            );

                        subContainer.className =
                            "subfolder";

                        wrapper.appendChild(
                            subContainer
                        );


                        let loaded = false;


                        el.addEventListener(
                            "click",
                            () => {

                                const isOpen =
                                    subContainer
                                        .classList
                                        .toggle(
                                            "open"
                                        );

                                chev.classList
                                    .toggle(
                                        "open",
                                        isOpen
                                    );

                                if (
                                    isOpen &&
                                    !loaded
                                ) {

                                    fetchContents(
                                        item.path,
                                        subContainer,
                                        depth + 1
                                    );

                                    loaded = true;

                                }

                            }
                        );


                    } else {

                        const ext =
                            item.name
                                .split(".")
                                .pop()
                                .toLowerCase();


                        /* OPEN */

                        if (
                            item.download_url
                        ) {

                            if (
                                IMAGE_EXTS
                                    .has(ext)
                            ) {

                                const btn =
                                    document.createElement(
                                        "a"
                                    );

                                btn.className =
                                    "action-btn";

                                btn.href =
                                    item.download_url;

                                btn.target =
                                    "_blank";

                                btn.textContent =
                                    "◈";

                                btn.title =
                                    "View image";

                                actions.appendChild(
                                    btn
                                );

                            }

                            else if (
                                VIDEO_EXTS
                                    .has(ext)
                            ) {

                                const btn =
                                    document.createElement(
                                        "button"
                                    );

                                btn.className =
                                    "action-btn";

                                btn.textContent =
                                    "▶";

                                btn.title =
                                    "Play video";


                                const videoWrapper =
                                    document.createElement(
                                        "div"
                                    );

                                videoWrapper.className =
                                    "video-wrapper";


                                const video =
                                    document.createElement(
                                        "video"
                                    );

                                video.controls =
                                    true;

                                video.preload =
                                    "none";

                                videoWrapper.appendChild(
                                    video
                                );

                                wrapper.appendChild(
                                    videoWrapper
                                );


                                btn.addEventListener(
                                    "click",
                                    () => {

                                        const open =
                                            videoWrapper
                                                .classList
                                                .toggle(
                                                    "open"
                                                );

                                        if (
                                            open &&
                                            !video.src
                                        ) {

                                            video.src =
                                                item.download_url;

                                        }

                                        btn.textContent =
                                            open
                                                ? "■"
                                                : "▶";

                                    }
                                );

                                actions.appendChild(
                                    btn
                                );

                            }

                            else {

                                const btn =
                                    document.createElement(
                                        "a"
                                    );

                                btn.className =
                                    "action-btn";

                                btn.href =
                                    item.download_url;

                                btn.target =
                                    "_blank";

                                btn.textContent =
                                    "↗";

                                btn.title =
                                    "Open file";

                                actions.appendChild(
                                    btn
                                );

                            }


                            /* DOWNLOAD */

                            const dl =
                                document.createElement(
                                    "a"
                                );

                            dl.className =
                                "action-btn";

                            dl.href =
                                item.download_url;

                            dl.download =
                                item.name;

                            dl.textContent =
                                "↓";

                            dl.title =
                                "Download";

                            actions.appendChild(
                                dl
                            );

                        }


                        /* COPY */

                        const copy =
                            document.createElement(
                                "button"
                            );

                        copy.className =
                            "action-btn";

                        copy.textContent =
                            "⧉";

                        copy.title =
                            "Copy URL";


                        copy.addEventListener(
                            "click",
                            async () => {

                                try {

                                    await navigator
                                        .clipboard
                                        .writeText(
                                            item.download_url ||
                                            item.html_url
                                        );

                                    copy.textContent =
                                        "✓";

                                    copy.classList.add(
                                        "copied"
                                    );

                                    setTimeout(
                                        () => {

                                            copy.textContent =
                                                "⧉";

                                            copy.classList
                                                .remove(
                                                    "copied"
                                                );

                                        },
                                        1500
                                    );

                                } catch (err) {

                                    console.error(
                                        err
                                    );

                                }

                            }
                        );


                        actions.appendChild(
                            copy
                        );

                    }


                    container.appendChild(
                        wrapper
                    );

                }

            }

            catch (err) {

                loadEl.remove();

                const error =
                    document.createElement(
                        "div"
                    );

                error.className =
                    "error-msg";

                error.innerHTML = `
                    <strong>
                        Failed to load files
                    </strong>
                    ${err.message}
                `;

                container.appendChild(
                    error
                );

                console.error(
                    "[Drive]",
                    err
                );

            }

        }


        fetchContents(
            "drive",
            document.getElementById(
                "file-list"
            ),
            0
        );

    </script>

</body>
</html>
